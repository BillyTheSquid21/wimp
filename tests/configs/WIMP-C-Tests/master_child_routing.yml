# The name of the test to post under the suite
name:
  master_child_routing

# The base test executable to run for this test
base_test: 
  WIMP-Test-03.exe

suite:
  WIMP-C-Tests

# The lines that all should appear in the output to be considered a pass
pass_conditions:
 - "PROCESS VALIDATION: PASSED"
 - "CHILD 1 RECEIVES FROM CHILD 2: PASSED"
 - "CHILD 2 RECEIVES FROM CHILD 1: PASSED"
 - "Test case has passed!"

# The lines that will cause a fail if they appear in the output
fail_conditions:
  - "FAIL"
  - "ERROR"

# The lines that will cause a warning if they appear in the output
warning_conditions:
  - "WARNING"
  - "Unexpected"

expected_return_code: 0