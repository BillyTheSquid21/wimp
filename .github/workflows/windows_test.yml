name: Run Windows Tests

on:
    push:
        branches: [ main, develop, features/* ]
    pull_request:
        branches: [ main ]

jobs:
    tests:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                submodules: recursive

            - name: Install dependencies
              run: choco install opencppcoverage --yes

            - name: Configure build
              run: |
                mkdir build
                cd build
                cmake .. -G "Visual Studio 17 2022" -A x64 -DWIMP_BUILD_TESTS=1

            - name: Build project
              run: cd build && cmake --build . --config Debug

            - name: Run tests with coverage
              run: |
                $testFiles = Get-ChildItem build\bin\Debug\*Test*.exe | Where-Object { $_.Name -notlike "*_b*" }
                $inputCoverageArgs = @()
                foreach ($test in $testFiles) {
                  Write-Host "Running $($test.FullName) with coverage"
                  $covFile = "$($test.BaseName).cov"
                  & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" --modules wimp --excluded_modules plibsys --sources wimp --export_type binary:$covFile -- $test.FullName
                  $inputCoverageArgs += "--input_coverage=$covFile"
                }
                
                Write-Host "Generating merged coverage report"
                & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" --modules wimp --excluded_modules plibsys --sources wimp --export_type html:coverage_report @inputCoverageArgs - powershell -Command "Write-Host 'Done'"
              shell: pwsh

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                name: coverage-report
                path: coverage_report/