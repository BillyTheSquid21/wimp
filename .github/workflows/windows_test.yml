name: Run Windows Tests

on:
    push:
        branches: [ main, develop, features/* ]
    pull_request:
        branches: [ main ]

jobs:
    tests:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                submodules: recursive

            - name: Setup VSTest and add to PATH
              uses: darenm/Setup-VSTest@v1
              id: setup_vstest

            - name: Setup OpenCppCoverage and add to PATh
              id: setup_opencppcoverage
              run: |
                choco install OpenCppCoverage -y
                echo "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

            - name: Configure build
              run: |
                mkdir build
                cd build
                cmake .. -G "Visual Studio 17 2022" -A x64 -DWIMP_BUILD_TESTS=1

            - name: Build project
              run: cd build && cmake --build . --config Debug

            - name: List test executables
              run: dir build\bin\Debug
              shell: cmd

            - name: Run test executables
              run: |
                Get-ChildItem build\bin\Debug\*Test* | Where-Object { $_.Name -notlike "*_b*" -and $_.Extension -ne ".pdb" } | ForEach-Object { Write-Host "Running $($_.FullName)"; & $_.FullName }
              shell: pwsh

            - name: Generate Coverage Report
              id: generate_test_report
              shell: pwsh
              run: |
                $testFiles = Get-ChildItem build\bin\Debug\*Test*.exe | Where-Object { $_.Name -notlike "*_b*" }
                foreach ($test in $testFiles) {
                  Write-Host "Running $($test.FullName) with coverage"
                  OpenCppCoverage.exe --sources wimp --export_type cobertura:coverage.xml -- $test.FullName
                }

            - name: Upload Report to Codecov
              uses: codecov/codecov-action@v2
              with:
                files: ./HelloCov.xml
                fail_ci_if_error: true
                functionalities: fix